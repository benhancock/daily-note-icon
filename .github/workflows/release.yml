name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify tag and manifest versions
        run: |
          node -e 'const manifest = require("./manifest.json"); const pkg = require("./package.json"); const versions = require("./versions.json"); if (manifest.version !== process.env.GITHUB_REF_NAME || pkg.version !== manifest.version || versions[manifest.version] !== manifest.minAppVersion) process.exit(1);'
      - name: Check and build plugin
        run: npm run check
      - name: Attest release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes main.js manifest.json styles.css
